name: CI/CD - PC Craft RealTime

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Docker Login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build & Push RealTime Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            adilaadhi/pc-realtime:latest
            adilaadhi/pc-realtime:${{ github.sha }}

      - name: Deploy to k3s
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            sudo kubectl set image deployment/pc-realtime \
              realtime=adilaadhi/pc-realtime:${{ github.sha }}
            sudo kubectl rollout status deployment/pc-realtime --timeout=120s

            echo "✅ RealTime Service deployed!"
            sudo kubectl get pods -l app=pc-realtime
